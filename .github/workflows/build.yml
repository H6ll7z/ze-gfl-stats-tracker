name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter create gfl_app --platforms=android
      - run: cp main.dart gfl_app/lib/main.dart
      - working-directory: gfl_app
        run: |
          flutter pub add http html shared_preferences url_launcher
          sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' android/app/src/main/AndroidManifest.xml
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: gfl-ze-stats-apk
          path: gfl_app/build/app/outputs/flutter-apk/app-release.apk
